# Eolas-ur/Tasmota — fork-specific ESP8266 firmware baseline verification.
# Does not replace upstream arendst/Tasmota CI workflows.

name: EolasUR ESP8266 Baseline Verify

on:
  workflow_dispatch:
  push:
    branches:
      - integration
      - 'feature/**'
      - 'project/**'
  pull_request:
    branches:
      - integration

permissions:
  contents: read

jobs:
  esp8266-baseline:
    # Fork-only; upstream forks of this file skip execution via repository guard.
    if: github.repository == 'Eolas-ur/Tasmota'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp8266_1M
          - esp8266_2M1M
    concurrency:
      group: eolasur-esp8266-${{ matrix.board }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO (pioarduino)
        run: |
          python -m pip install --upgrade pip
          pip install 'pioarduino==6.2.0.post1'

      - name: Write board profile override (gitignored)
        run: |
          {
            echo '; Generated by EolasUR_ESP8266_Baseline_Verify — not committed'
            echo '[env:tasmota]'
            echo "board = ${{ matrix.board }}"
          } > platformio_override.ini

      - name: Build tasmota
        id: build
        run: |
          set -o pipefail
          platformio run -e tasmota 2>&1 | tee build.log

      - name: Report resource usage
        if: always() && steps.build.outcome != 'cancelled'
        run: |
          SHA="${{ github.sha }}"
          BOARD="${{ matrix.board }}"
          STATUS="${{ steps.build.outcome }}"

          RAM_LINE="$(grep -E '^RAM:' build.log | tail -1 || true)"
          FLASH_LINE="$(grep -E '^Flash:' build.log | tail -1 || true)"
          IRAM_LINE="$(grep -E '^Used static IRAM:' build.log | tail -1 || true)"
          COMP_LINE="$(grep -E '^Compression reduced firmware size' build.log | tail -1 || true)"

          BIN_SIZE=""
          GZ_SIZE=""
          if [ -f build_output/firmware/tasmota.bin ]; then
            BIN_SIZE="$(wc -c < build_output/firmware/tasmota.bin | tr -d ' ')"
          fi
          if [ -f build_output/firmware/tasmota.bin.gz ]; then
            GZ_SIZE="$(wc -c < build_output/firmware/tasmota.bin.gz | tr -d ' ')"
          fi

          {
            echo "## ESP8266 baseline — \`${BOARD}\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Board | \`${BOARD}\` |"
            echo "| Build | **${STATUS}** |"
            echo "| Static RAM | ${RAM_LINE:-_(not found)_} |"
            echo "| Program flash | ${FLASH_LINE:-_(not found)_} |"
            echo "| Static IRAM | ${IRAM_LINE:-_(not found)_} |"
            echo "| Compression | ${COMP_LINE:-_(not found)_} |"
            echo "| \`tasmota.bin\` (bytes) | ${BIN_SIZE:-_(missing)_} |"
            echo "| \`tasmota.bin.gz\` (bytes) | ${GZ_SIZE:-_(missing)_} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-${{ matrix.board }}-${{ github.run_number }}
          path: |
            build_output/firmware/tasmota.bin
            build_output/firmware/tasmota.bin.gz
          retention-days: 7
          if-no-files-found: error