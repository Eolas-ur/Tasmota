; M5-00B/C/D: compile-gated HTTPS feasibility environment (ESP8266 / esp8266_1M).
; Certificates live in gitignored https_feasibility_local/certs/ (see README there).
;
; USE_TLS: project lib/lib_ssl/bearssl-esp8266 is named "BearSSL" and replaces the
; SDK libbearssl.a; it requires stack_thunk_yield from tls_mini. That also enables
; Tasmota's yield-during-RSA/EC points inside the linked crypto objects used by
; core WiFiServerSecure. Do not treat this as enabling MQTT TLS features beyond
; the compile flag side-effects already present when USE_TLS is defined.
;
; M5-00D: extra_scripts generates a project-local WiFiClientSecureBearSSL.cpp
; overlay (TLS 1.2 + ECDHE-ECDSA-AES128-GCM only) without modifying the global
; PlatformIO framework package. Ordinary env:tasmota builds do not load this script.

[env:tasmota-https-feasibility]
extends = env:tasmota
board = esp8266_1M
; Stock esp82xx_defaults sets -DBEARSSL_SSL_BASIC which compiles out ECDSA server
; support in WiFiClientSecureBearSSL.cpp (_connectSSLServerEC -> false).
; HTTPS feasibility requires full BearSSL EC server; remove BASIC for this env only.
build_unflags =
  ${common.build_unflags}
  -DBEARSSL_SSL_BASIC
extra_scripts =
  ${esp82xx_defaults.extra_scripts}
  pre:https_feasibility_local/scripts/bearssl_server_secure_overlay.py
build_flags =
  ${env:tasmota.build_flags}
  -DUSE_WEBSERVER_HTTPS
  -DUSE_TLS
  -DHTTPS_FEASIBILITY_INSTRUMENT=1
  -DHTTPS_FEASIBILITY_SECURE_TLS=1
  -DHTTPS_FEASIBILITY_RX_BUF=4096
  -DHTTPS_FEASIBILITY_TX_BUF=1024
  -DHTTPS_FEASIBILITY_PORT=443
  -Ihttps_feasibility_local/certs
  -DCODE_IMAGE_STR='"tasmota-https-feasibility"'
